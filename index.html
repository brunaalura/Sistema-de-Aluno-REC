
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <aside class="sidebar">
            <h2>Educa<span>System</span></h2>

            <nav>
                <a href="#dashboard">Dashboard</a>
                <a href="#cadastro">Cadastrar Aluno</a>
                <a href="#lista">Lista de Alunos</a>
            </nav>

            <div class="sidebar-footer">
                Sistema Escolar
            </div>
        </aside>

        <main class="main-content">

            <header class="header">
                <div>
                    <h1>Sistema de Gestão de Alunos</h1>
                    <p>Gerenciamento de informações escolares</p>
                </div>

                <div class="user">
                    👤 Administrador
                </div>
            </header>

            <!-- DASHBOARD -->
            <section id="dashboard">

                <h2>Dashboard</h2>

                <div class="cards">

                    <div class="card">
                        <h3>Total de Alunos</h3>
                        <p id="totalAlunos">0</p>
                    </div>

                    <div class="card">
                        <h3>Alunos Ativos</h3>
                        <p id="alunosAtivos">0</p>
                    </div>

                    <div class="card">
                        <h3>Turmas</h3>
                        <p id="totalTurmas">0</p>
                    </div>

                </div>

            </section>

            <!-- CADASTRO -->
            <section id="cadastro">

                <h2>Cadastro de Aluno</h2>

                <form id="formAluno">

                    <input type="hidden" id="idAluno">

                    <div class="form-grid">

                        <div class="campo">
                            <label>Nome completo</label>
                            <input type="text" id="nome" placeholder="Digite o nome do aluno" required>
                        </div>

                        <div class="campo">
                            <label>Matrícula</label>
                            <input type="text" id="matricula" placeholder="Ex: 2026001" required>
                        </div>

                        <div class="campo">
                            <label>Data de nascimento</label>
                            <input type="date" id="nascimento" required>
                        </div>

                        <div class="campo">
                            <label>E-mail</label>
                            <input type="email" id="email" placeholder="aluno@email.com">
                        </div>

                        <div class="campo">
                            <label>Telefone</label>
                            <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                        </div>

                        <div class="campo">
                            <label>Turma</label>
                            <select id="turma" required>
                                <option value="">Selecione uma turma</option>
                                <option value="1º Ano">1º Ano</option>
                                <option value="2º Ano">2º Ano</option>
                                <option value="3º Ano">3º Ano</option>
                            </select>
                        </div>

                    </div>

                    <div class="buttons">
                        <button type="submit" id="btnSalvar">Cadastrar Aluno</button>
                        <button type="reset" class="btnLimpar">Limpar</button>
                    </div>

                </form>

            </section>

            <!-- LISTA -->
            <section id="lista">

                <h2>Lista de Alunos</h2>

                <div class="pesquisa">
                    <input type="text" id="pesquisa" placeholder="Pesquisar por nome ou matrícula...">
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Matrícula</th>
                                <th>Nome</th>
                                <th>Turma</th>
                                <th>E-mail</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="tabelaAlunos">
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
